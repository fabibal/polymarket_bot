services:

  # ── WireGuard VPN (gluetun) ─────────────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8082:8080"        # polymarket bot dashboard
      - "6901:3000"        # kasmchrome (chromium remote desktop)
    volumes:
      - gluetun_data:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=51820
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show tun0 | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Copy trading bot ─────────────────────────────────────────────────────
  bot:
    build: .
    container_name: polymarket_bot
    # Run as the node base-image user (uid/gid 1000) so it matches the owner of the
    # host-mounted bullpen creds. Running as root tripped the CLI's BULLPEN_HOME
    # ownership check ("owned by uid 1000, not current uid 0") after a CLI bump.
    user: "1000:1000"
    # Route ALL traffic through the gluetun VPN container
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      # Persisted trade log
      - ./data:/app/data
      # Mount bullpen auth config from host (run `bullpen login` on host first).
      # Mounted under the node user's HOME (uid 1000) — /root is mode 700 and not
      # traversable by a non-root process.
      - ${BULLPEN_CONFIG_PATH:-~/.bullpen}:/home/node/.bullpen:ro
      # Docker socket (read-only) — used by dashboard to query container CPU/RAM stats
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host logs dir (read-only) — dashboard reads weekly-macro-scan output
      - ./logs:/app/logs:ro
    # Shared Telegram credentials (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) — used by
    # the in-bot risk alerts (trader decay kill switch, daily-loss circuit breaker).
    env_file:
      - /home/user/.env.shared
    environment:
      - NODE_OPTIONS=--max-old-space-size=450
      - DRY_RUN=true
      - PORT=8080
      - DB_FILE=/app/data/store.db
      - HOME=/home/node                     # bullpen CLI reads creds from $HOME/.bullpen
      - BULLPEN_HOME=/home/node/.bullpen     # explicit; matches the mount above
      - POLL_INTERVAL_MS=30000          # 30 seconds
      - PRICE_UPDATE_INTERVAL_MS=300000 # 5 minutes
      # Entry-filter + leaderboard env vars removed 2026-05-29 (watchlist-only — they were
      # inert no-ops): LEADERBOARD_REFRESH_MS, AUTO_EXCLUDE_WIN_RATE_THRESHOLD, MIN_PRICE,
      # MIN_PRICE_SPORTS, MAX_PRICE, MAX_SPREAD, FORCE_EXCLUDE_CATEGORIES,
      # MAX_POSITIONS_PER_MARKET(_SPORTS), MAX_TOTAL_OPEN_POSITIONS, MIN_TRADER_SAMPLE.
      - SIMULATED_WALLET_SIZE=1000   # $ wallet simulation; 0 disables. Active size cap on watchlist BUYs.
      - WALLET_CAP_UTILIZATION=0.80  # stop opening new BUYs at 80% utilization ($800 of $1000)
      - GAS_COST_PER_BUY=0  # Polymarket has NO fees on sports markets (only 15-min crypto). Polygon gas negligible.
      - SLIPPAGE_RATE=0.02   # 2% slippage each side (entry at ask, exit at bid)
      # Risk thresholds as % of SIMULATED_WALLET_SIZE (scale automatically with wallet
      # and stay sane if DYNAMIC_SIZING multiplies trade sizes). At $1000: -50 / -30 / -30.
      # Absolute overrides (TRADER_DECAY_THRESHOLD_30D / _7D, DAILY_LOSS_CIRCUIT_BREAKER)
      # win over the % vars when set.
      - TRADER_DECAY_THRESHOLD_PCT_30D=5   # per-trader kill switch, 30d window
      - TRADER_DECAY_THRESHOLD_PCT_7D=3    # per-trader kill switch, 7d window (catches slow bleed under a 30d cushion)
      - DAILY_LOSS_CIRCUIT_BREAKER_PCT=3   # account breaker: pause ALL copying 24h
      - DYNAMIC_SIZING=false             # OFF: flat per-trader copyAmount. ON: 1% of ask_depth_5, clamped to [MIN,MAX]_TRADE_AMOUNT
      - MIN_TRADE_AMOUNT=5               # dynamic-sizing floor ($)
      - MAX_TRADE_AMOUNT=25              # dynamic-sizing cap ($)
      - POLYMARKET_ANALYTICS_API_KEY=${POLYMARKET_ANALYTICS_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped

  # ── Chromium browser (routed through gluetun VPN) ──────────────────────
  kasmchrome:
    image: lscr.io/linuxserver/chromium
    container_name: kasmchrome
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    shm_size: "2g"
    environment:
      - KASM_SVC_ENABLE_CLIPBOARD=true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

volumes:
  gluetun_data:
